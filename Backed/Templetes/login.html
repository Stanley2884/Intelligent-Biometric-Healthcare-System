<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioHealth AI - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #0f766e);
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #0f766e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .system-status {
            text-align: center;
            background: #ecfdf5;
            color: #047857;
            padding: 9px;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #115e59;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        .security {
            text-align: center;
            margin-top: 12px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">B</div>

            <h1>BioHealth AI</h1>

            <p class="subtitle">
                Intelligent Biometric Healthcare System
            </p>

            <div class="system-status">
                ● SYSTEM READY
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-button">
                    Login to System
                </button>

            </form>

            <div id="message" class="message"></div>

            <div class="security">
                🔒 Secure healthcare system access
            </div>

            <div class="footer">
                BioHealth AI © 2026
            </div>

        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            const message = document.getElementById("message");

            message.style.display = "none";

            try {

                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })
                });

                const result = await response.text();

                if (response.ok && result.includes("LOGIN SUCCESSFUL")) {

                    message.style.display = "block";
                    message.style.background = "#ecfdf5";
                    message.style.color = "#047857";
                    message.innerHTML = "Login successful. Redirecting...";

                    setTimeout(function () {
                        window.location.href = "/dashboard.html";
                    }, 800);

                } else {

                    message.style.display = "block";
                    message.style.background = "#fef2f2";
                    message.style.color = "#b91c1c";
                    message.innerHTML = result || "Invalid username or password.";

                }

            } catch (error) {

                message.style.display = "block";
                message.style.background = "#fef2f2";
                message.style.color = "#b91c1c";
                message.innerHTML = "Unable to connect to the healthcare system.";

            }

        });

    </script>

</body>

</html>
